# GitHub Actions CI workflow for pnpm-based TypeScript project
# This workflow runs tests, linting, type checks, and formatting checks on PRs and workflow calls

name: CI

on:
  push:
    branches:
      - main
      - master
      - next
  pull_request:
    branches:
      - main
      - master
      - next
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: pixpilot/github-actions/setup-pnpm-project@v1
        with:
          build: 'true'

      - name: Run tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: TypeScript check
        run: pnpm typecheck

      - name: Prettier check
        run: pnpm format